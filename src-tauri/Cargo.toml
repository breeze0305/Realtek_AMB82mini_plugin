[package]
name = "amb82-mini-computer-plugin"
version = "3.17.2"
description = "Realtek AMB82-mini Windows desktop assistant"
authors = ["breeze0305"]
edition = "2021"
rust-version = "1.97"

[lib]
name = "amb82_plugin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.0.6", features = [] }

[dependencies]
hpvcd = "=0.3.2"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "bmp", "webp"] }
img-parts = "=0.4.0"
regex = "1"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "=2.0.6", features = [] }
tauri-codegen = "=2.0.5"
tauri-macros = "=2.0.5"
tauri-runtime = "=2.1.1"
tauri-runtime-wry = "=2.1.2"
tauri-utils = "=2.2.0"
thiserror = "1"
ureq = { version = "=2.10.1", default-features = true }
webview2-com = "=0.33.0"
windows = "=0.58.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
